# Predeclared, shared across scenes/noise levels; no reference-based tuning.
method: rgb_pose_refine
seed: 42
rgb_matching:
  neighbor_window: 3
  max_pairs_per_image: 6
  max_keypoints: 2048
  filter_threshold: 0.1
  depth_confidence: -1
  width_confidence: -1
  flash: false
  lightglue_commit: 2f23ca2ea9638cecad7f7220795210fc6b8353c3
  model_cache: .cache/rgb_pose
  ransac_seed: 42
  ransac_threshold_px: 1.0
  ransac_confidence: 0.999
  ransac_max_iterations: 10000
  min_inliers: 32
  min_inlier_ratio: 0.35
  min_coverage: 0.08
  min_mean_confidence: 0.15
  reliability_saturation_inliers: 256
pose_refinement:
  reference_camera_index: 0
  iterations: 400
  rotation_lr: 0.0003
  translation_lr_ratio: 0.0005
  huber_px: 1.0
  lambda_prior: 1.0
  lambda_rotation: 1000.0
  lambda_translation: 1000.0
  max_rotation_deg: 5.0
  max_translation_ratio: 0.05
  minimum_baseline_ratio: 0.000001
